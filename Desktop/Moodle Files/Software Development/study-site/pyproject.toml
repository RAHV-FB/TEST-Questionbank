[project]
name = "swdev-midterm-study"
version = "0.1.0"
description = "Mid-term study platform for Software Development for Business (content build + validation)"
requires-python = ">=3.13"
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.18",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pygments>=2.21.0.20260819",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
src = [".", "tools"]
# The content scripts and the source Markdown are authored elsewhere; `ruff` here checks tools/.
extend-exclude = ["content/src", "sources"]

[tool.mypy]
strict = true
files = ["tools"]
